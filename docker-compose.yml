services:
  nginx:
    image: nginx:alpine
    container_name: alloy-proxy
    restart: unless-stopped
    depends_on:
      - alloy-ui
      - alloy-api
    networks:
      - alloy_intranet

  alloy-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alloy-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    depends_on:
      alloy-api:
        condition: service_healthy
    networks:
      - alloy_intranet

  alloy-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alloy-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://0.0.0.0:8082/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - alloy_intranet

  redis:
    image: redis:7-alpine
    container_name: alloy-redis-srv
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alloy_intranet

  postgres:
    image: postgres:16-alpine
    container_name: alloy-postgres-db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-alloy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-alloy_secret}
      - POSTGRES_DB=${POSTGRES_DB:-alloydb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-alloy} -d $${POSTGRES_DB:-alloydb} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alloy_intranet

  cassandra:
    image: cassandra:4.1
    container_name: alloy-cassandra-db
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: 'cass_cluster'
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ['CMD-SHELL', "cqlsh -e 'describe keyspaces'"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - alloy_intranet

  migrations:
    image: kukymbr/goose-docker:latest
    container_name: alloy-db-migrations
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/internal/shared/database/migrations:/migrations
    environment:
      - GOOSE_MIGRATION_DIR=/migrations
      - GOOSE_DRIVER=postgres
      - GOOSE_DBSTRING=postgres://${POSTGRES_USER:-alloy}:${POSTGRES_PASSWORD:-alloy_secret}@postgres:5432/${POSTGRES_DB:-alloydb}?sslmode=disable
    env_file:
      - ./backend/.env
    command: up
    networks:
      - alloy_intranet

volumes:
  redis_data:
  postgres_data:
  cassandra_data:

networks:
  alloy_intranet:
    driver: bridge