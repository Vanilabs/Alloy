<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're Invited to Alloy</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, sans-serif;
      background-color: #f4f4f5;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background-color: #f4f4f5; padding: 40px 20px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 480px;
              background-color: #ffffff;
              border-radius: 12px;
              box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            "
          >
            <!-- Header -->
            <tr>
              <td style="padding: 40px 40px 20px 40px; text-align: center">
                <h1
                  style="
                    margin: 0;
                    font-size: 28px;
                    font-weight: 700;
                    color: #18181b;
                  "
                >
                  Alloy
                </h1>
              </td>
            </tr>
            <!-- Content -->
            <tr>
              <td style="padding: 20px 40px 40px 40px">
                <h2
                  style="
                    margin: 0 0 16px 0;
                    font-size: 22px;
                    font-weight: 600;
                    color: #18181b;
                  "
                >
                  You're Invited!
                </h2>
                <p
                  style="
                    margin: 0 0 24px 0;
                    font-size: 16px;
                    line-height: 1.6;
                    color: #52525b;
                  "
                >
                  You've been invited to join Alloy. Click the button below to
                  accept the invitation and get started.
                </p>
                <!-- Button -->
                <table
                  role="presentation"
                  width="100%"
                  cellspacing="0"
                  cellpadding="0"
                >
                  <tr>
                    <td align="center" style="padding: 8px 0 24px 0">
                      <a
                        href="{{.inviteUrl}}?token={{.token}}"
                        style="
                          display: inline-block;
                          padding: 14px 32px;
                          background-color: #18181b;
                          color: #ffffff;
                          text-decoration: none;
                          font-size: 16px;
                          font-weight: 600;
                          border-radius: 8px;
                        "
                      >
                        Accept Invitation
                      </a>
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 0;
                    font-size: 14px;
                    line-height: 1.6;
                    color: #71717a;
                  "
                >
                  If you didn't expect this invitation, you can safely ignore
                  this email.
                </p>
              </td>
            </tr>
            <!-- Footer -->
            <tr>
              <td
                style="
                  padding: 20px 40px 40px 40px;
                  border-top: 1px solid #e4e4e7;
                "
              >
                <p
                  style="
                    margin: 0;
                    font-size: 14px;
                    color: #a1a1aa;
                    text-align: center;
                  "
                >
                  © 2025 Alloy. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
